apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: order-notify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker-service
          image: order-notify-system-worker-service:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: order-notify-config
            - secretRef:
                name: order-notify-secrets
