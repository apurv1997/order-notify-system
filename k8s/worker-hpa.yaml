apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: order-notify
spec:
  secretTargetRef:
    - parameter: host
      name: order-notify-secrets
      key: RABBITMQ_MANAGEMENT_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-service-scaler
  namespace: order-notify
spec:
  scaleTargetRef:
    name: worker-service
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: order-processing
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: rabbitmq-trigger-auth
